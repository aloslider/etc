_modules=()
for _mod in "${MODULES[@]}"; do
    case $_mod in
        nvidia|nvidia_*) continue ;;
    esac
    _modules+=("$_mod")
done
MODULES=("${_modules[@]}")
unset _mod _modules

_hooks=()
for _hook in "${HOOKS[@]}"; do
    if [[ $_hook == kms ]]; then
        _hooks+=(nvidia-skip-initrd)
    fi
    [[ $_hook == nvidia-skip-initrd ]] && continue
    _hooks+=("$_hook")
done
HOOKS=("${_hooks[@]}")
unset _hook _hooks
